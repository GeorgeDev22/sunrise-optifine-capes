[package]
name = "mod-optifine-capes"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# The pinned SDK, fetched into .sunrise/sdk/ by `cargo sunrise-mod`; the launcher builds against
# its own copy of the same build.
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }
optifine-capes-core = { path = "src/core" }
# Plain HTTP only: OptiFine's cape server has no HTTPS, so no TLS stack is pulled in.
ureq = { version = "2", default-features = false }
